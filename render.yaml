# ============================================================
# Render Blueprint Specification — GenUI Stack
# Instantly deploys Redis, Backend (API + Celery), and Frontend.
# ============================================================

services:
  # -- Redis Database (Cache & Celery Broker) ---------------------------------
  - type: redis
    name: redis
    plan: free
    ipAllowList: [] # Secure: only accessible within the Render private network

  # -- FastAPI Backend API + Celery Worker (Combined Service) -----------------
  - type: web
    name: api
    plan: free # Can be upgraded to 'starter' for fast continuous running
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    
    # Run Uvicorn + Celery concurrently using our startup script
    dockerCommand: bash start_render.sh
    
    # Environment Variables
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      
      # Generates a random secure secret key for JWT session hashing
      - key: SECRET_KEY
        generateValue: true
      
      # Redis connection string (dynamically injected from the Redis service above)
      - key: REDIS_URL
        fromService:
          name: redis
          type: redis
          property: connectionString
      
      # Forces ChromaDB to save its vectors inside the persistent SQLite disk
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chroma_data
      
      - key: CHROMA_COLLECTION_NAME
        value: fberaucracy_procedures
      
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
      
      # CORS configuration: Allow frontend to communicate with API
      - key: ALLOWED_ORIGINS
        value: "*" # Will be restricted to the frontend URL after deployment
      
      # Manual input required on the Render Dashboard:
      - key: OPENROUTER_API_KEY
        value: sk-or-v1-placeholder-paste-in-render-dashboard
      
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      
      - key: OPENROUTER_APP_TITLE
        value: f-idarty

  # -- Flutter Web Frontend (Nginx Server) -----------------------------------
  - type: web
    name: frontend
    plan: free
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
