# ============================================================
# Nginx config for serving Flutter Web (SPA)
# Proxies /api/* requests to the backend container
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for Flutter web build
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression for Flutter assets ──────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 256;

    # ── API Proxy — forward /api/* to the backend container ──────────────────
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout for long AI operations
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Health endpoint proxy ────────────────────────────────────────────────
    location /health {
        proxy_pass http://api:8000/health;
    }

    # ── Flutter SPA fallback — all other routes go to index.html ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
